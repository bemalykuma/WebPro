<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my lovely pet</title>
    <style>
        * {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .card1, .card2, .card3, .card4, .card5, .card6, .card7, .card8 {
            float: left;
            width: 23%;
            margin: 1%;
            box-shadow: 0px 0px 10px rgb(169, 169, 169);
            text-align: center;
        }
        img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        @media screen and (max-width: 1000px) {
            .card1, .card2, .card3, .card4, .card5, .card6, .card7, .card8 {
                width: 45%;
                float: left;
                margin: 10px 10px;
            }
        }
        @media screen and (max-width: 600px) {
            .card1, .card2, .card3, .card4, .card5, .card6, .card7, .card8 {
                width: 100%;
                margin: 10px 0;
                float: none;
            }
        }
    </style>
</head>
<body>
    <h1>We are lovely pets</h1>
    <div class="card1">
        <img src="images/deck.jpg" alt="">
        <h2>Nong Deck</h2>
    </div>    
    <div class="card2">
        <img src="images/chepo.jpg" alt="">
        <h2>Chepo</h2>
    </div>    
    <div class="card3">
        <img src="images/sil.jpg" alt="">
        <h2>sil</h2>
    </div>    
    <div class="card4">
        <img src="images/Mee.jpg" alt="">
        <h2>Mee</h2>
    </div>    
    <div class="card5">
        <img src="images/ku.jpg" alt="">
        <h2>Nong Ku</h2>
    </div>    
    <div class="card6">
        <img src="images/somsri.jpg" alt="">
        <h2>Somsri</h2>
    </div>    
    <div class="card7">
        <img src="images/joii.jpg" alt="">
        <h2>Joii</h2>
    </div>    
    <div class="card8">
        <img src="images/pong.jpg" alt="">
        <h2>Pong</h2>
    </div>    
</body>
</html>
